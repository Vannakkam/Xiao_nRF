<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF Sense BLE IMU Streamer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #2c3e50; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        button { padding: 10px 18px; font-size: 14px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; color: white; transition: background 0.2s; }
        #connectBtn { background: #3498db; }
        #connectBtn:hover { background: #2980b9; }
        #startBtn { background: #2ecc71; }
        #startBtn:hover { background: #27ae60; }
        #stopBtn { background: #e74c3c; }
        #stopBtn:hover { background: #c0392b; }
        #downloadBtn { background: #9b59b6; }
        #downloadBtn:hover { background: #8e44ad; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        .status { padding: 12px; background: #ecf0f1; border-radius: 6px; font-family: monospace; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 13px; }
        th { background-color: #f8f9fa; }
        .table-container { max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>XIAO nRF Sense IMU Streamer</h2>
    <div class="status" id="statusText">Status: Disconnected</div>

    <div class="btn-group">
        <button id="connectBtn" onclick="toggleConnection()">Connect BLE</button>
        <button id="startBtn" onclick="startStreaming()" disabled>Start Stream</button>
        <button id="stopBtn" onclick="stopStreaming()" disabled>Stop Stream</button>
        <button id="downloadBtn" onclick="downloadCSV()" disabled>Download CSV</button>
    </div>

    <h3>Live Data Stream (<span id="sampleCount">0</span> samples collected)</h3>
    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Unix Epoch (s)</th>
                    <th>Offset (ms)</th>
                    <th>Accel X (g)</th>
                    <th>Accel Y (g)</th>
                    <th>Accel Z (g)</th>
                    <th>Gyro X (dps)</th>
                    <th>Gyro Y (dps)</th>
                    <th>Gyro Z (dps)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Live rows populate here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHAR_DATA_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const CHAR_TIME_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";

    let bluetoothDevice, gattServer, imuService, dataChar, timeChar;
    let recordedData = [];
    let isStreaming = false;

    const statusText = document.getElementById("statusText");
    const connectBtn = document.getElementById("connectBtn");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const sampleCountEl = document.getElementById("sampleCount");
    const dataTableBody = document.querySelector("#dataTable tbody");

    async function toggleConnection() {
        try {
            if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                statusText.innerText = "Status: Scanning & Connecting...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "XIAO-IMU" }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                gattServer = await bluetoothDevice.gatt.connect();
                imuService = await gattServer.getPrimaryService(SERVICE_UUID);
                dataChar = await imuService.getCharacteristic(CHAR_DATA_UUID);
                timeChar = await imuService.getCharacteristic(CHAR_TIME_UUID);

                statusText.innerText = "Status: Connected to XIAO-IMU";
                connectBtn.innerText = "Disconnect BLE";
                connectBtn.style.background = "#e74c3c";
                startBtn.disabled = false;
            } else {
                await bluetoothDevice.gatt.disconnect();
            }
        } catch (error) {
            console.error(error);
            statusText.innerText = "Status: Connection failed - " + error;
        }
    }

    function onDisconnected() {
        statusText.innerText = "Status: Disconnected";
        connectBtn.innerText = "Connect BLE";
        connectBtn.style.background = "#3498db";
        startBtn.disabled = true;
        stopBtn.disabled = true;
        isStreaming = false;
    }

    async function startStreaming() {
        if (!timeChar || !dataChar) return;
        try {
            recordedData = [];
            dataTableBody.innerHTML = "";
            sampleCountEl.innerText = "0";

            // Transmit current Unix Epoch timestamp to synchronize MCU
            const currentEpochSec = Math.floor(Date.now() / 1000);
            const buffer = new ArrayBuffer(4);
            new DataView(buffer).setUint32(0, currentEpochSec, true);
            await timeChar.writeValue(buffer);

            // Listen for IMU notifications
            await dataChar.startNotifications();
            dataChar.addEventListener('characteristicvaluechanged', handleIMUPacket);

            isStreaming = true;
            statusText.innerText = "Status: Streaming IMU data...";
            startBtn.disabled = true;
            stopBtn.disabled = false;
            downloadBtn.disabled = true;
        } catch (error) {
            console.error(error);
            statusText.innerText = "Status: Error starting stream - " + error;
        }
    }

    async function stopStreaming() {
        if (dataChar && isStreaming) {
            await dataChar.stopNotifications();
            dataChar.removeEventListener('characteristicvaluechanged', handleIMUPacket);
        }
        isStreaming = false;
        statusText.innerText = "Status: Stream stopped.";
        startBtn.disabled = false;
        stopBtn.disabled = true;
        if (recordedData.length > 0) downloadBtn.disabled = false;
    }

    function handleIMUPacket(event) {
        const value = event.target.value;
        // Unpack packet binary structure matching C++ struct
        const baseEpoch = value.getUint32(0, true);
        
        // 2 samples per packet payload
        for (let i = 0; i < 2; i++) {
            let offset = 4 + (i * 16);
            if (offset >= value.byteLength) break;

            let timestamp_ms = value.getUint32(offset, true);
            let ax = value.getInt16(offset + 4, true) / 1000.0;
            let ay = value.getInt16(offset + 6, true) / 1000.0;
            let az = value.getInt16(offset + 8, true) / 1000.0;
            let gx = value.getInt16(offset + 10, true) / 10.0;
            let gy = value.getInt16(offset + 12, true) / 10.0;
            let gz = value.getInt16(offset + 14, true) / 10.0;

            const rowData = { baseEpoch, timestamp_ms, ax, ay, az, gx, gy, gz };
            recordedData.push(rowData);

            // Update UI Table (keep last 50 entries visible for performance)
            if (dataTableBody.rows.length > 50) dataTableBody.deleteRow(-1);
            let row = dataTableBody.insertRow(0);
            row.innerHTML = `<td>${baseEpoch}</td><td>${timestamp_ms}</td><td>${ax.toFixed(3)}</td><td>${ay.toFixed(3)}</td><td>${az.toFixed(3)}</td><td>${gx.toFixed(2)}</td><td>${gy.toFixed(2)}</td><td>${gz.toFixed(2)}</td>`;
            sampleCountEl.innerText = recordedData.length;
        }
    }

    function downloadCSV() {
        if (recordedData.length === 0) return;
        let csvContent = "data:text/csv;charset=utf-8,Unix_Epoch_Sec,Timestamp_ms,Accel_X_g,Accel_Y_g,Accel_Z_g,Gyro_X_dps,Gyro_Y_dps,Gyro_Z_dps\r\n";
        
        recordedData.forEach(row => {
            csvContent += `${row.baseEpoch},${row.timestamp_ms},${row.ax},${row.ay},${row.az},${row.gx},${row.gy},${row.gz}\r\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `xiao_imu_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
