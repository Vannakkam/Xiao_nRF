<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>IMU BLE Recorder</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --fg: #e0e0e0;
      --accent: #00d4aa;
      --danger: #ff4757;
      --warn: #ffa502;
      --surface: #16161f;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    
    body.display-off #app {
      opacity: 0.02;
      filter: blur(2px);
      transition: opacity 0.6s ease, filter 0.6s ease;
      pointer-events: none;
    }
    body.display-off #wake-overlay {
      display: flex;
    }
    
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
      opacity: 1;
      filter: none;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    
    #wake-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: transparent;
      z-index: 999;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.1);
      font-size: 14px;
      letter-spacing: 2px;
    }
    
    header {
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #222;
    }
    h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.5px; }
    .subtitle { font-size: 0.75rem; color: #666; margin-top: 4px; }
    
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      padding: 10px 14px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid #222;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #333; display: inline-block; margin-right: 6px;
    }
    .status-dot.connected { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status-dot.recording { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .metric {
      background: var(--surface);
      padding: 14px 10px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #222;
    }
    .metric-value {
      font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
    .metric-label { font-size: 0.65rem; color: #777; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .metric.danger .metric-value { color: var(--danger); }
    .metric.warn .metric-value { color: var(--warn); }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
      padding-bottom: 20px;
    }
    
    button {
      border: none; border-radius: 14px; padding: 18px;
      font-size: 1rem; font-weight: 600; color: #fff;
      cursor: pointer; transition: transform 0.1s, opacity 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      letter-spacing: 0.3px;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    
    .btn-connect { background: #2d3436; border: 1px solid #444; }
    .btn-start { background: var(--accent); color: #000; }
    .btn-stop { background: var(--danger); }
    .btn-refresh { background: var(--warn); color: #000; }
    .btn-download { background: #3742fa; }
    
    .row { display: flex; gap: 10px; }
    .row button { flex: 1; }
    
    .log {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 0.7rem;
      color: #555;
      max-height: 60px;
      overflow-y: auto;
      padding: 8px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid #1a1a1a;
      line-height: 1.4;
    }
    .log div { margin-bottom: 2px; }
  </style>
</head>
<body>

<div id="wake-overlay">TAP TO WAKE</div>

<div id="app">
  <header>
    <h1>IMU Recorder</h1>
    <div class="subtitle">BLE Streamer &bull; 200 Hz &bull; Batched x4</div>
  </header>
  
  <div class="status-bar">
    <span><span id="conn-dot" class="status-dot"></span><span id="conn-text">Disconnected</span></span>
    <span id="rec-indicator" style="display:none; color:var(--danger); font-weight:600;">&#9679; REC</span>
  </div>
  
  <div class="metrics">
    <div class="metric">
      <div class="metric-value" id="sample-count">0</div>
      <div class="metric-label">Samples</div>
    </div>
    <div class="metric" id="pkt-metric">
      <div class="metric-value" id="packet-loss">0</div>
      <div class="metric-label">Dropped Pkts</div>
    </div>
    <div class="metric">
      <div class="metric-value" id="batch-size">0</div>
      <div class="metric-label">Batch /Pkt</div>
    </div>
  </div>
  
  <div class="log" id="log"></div>
  
  <div class="controls">
    <button class="btn-connect" id="btn-connect" onclick="connect()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      Pair Device
    </button>
    
    <button class="btn-start" id="btn-start" onclick="startRecording()" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
      Start Recording
    </button>
    
    <button class="btn-stop" id="btn-stop" onclick="stopRecording()" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      Stop Recording
    </button>
    
    <div class="row">
      <button class="btn-refresh" id="btn-refresh" onclick="refreshConnection()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Refresh
      </button>
      <button class="btn-download" id="btn-download" onclick="downloadCSV()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Download CSV
      </button>
    </div>
  </div>
</div>

<script>
// ==================== BLE CONFIG ====================
const SERVICE_UUID       = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CHAR_TIME_UUID     = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
const CHAR_CONTROL_UUID  = 'beb5483e-36e1-4688-b7f5-ea07361b26a9';
const CHAR_DATA_UUID     = 'beb5483e-36e1-4688-b7f5-ea07361b26aa';

// ==================== STATE ====================
let device = null;
let server = null;
let service = null;
let timeChar = null;
let controlChar = null;
let dataChar = null;

let baseEpochMs = 0;
let recording = false;
let samples = [];
let lastSeq = -1;
let droppedPackets = 0;
let totalPackets = 0;
let batchAccumulator = 0;
let batchCount = 0;

const ACCEL_SCALE = 2.0 / 32768.0;
const GYRO_SCALE  = 250.0 / 32768.0;

// ==================== AUDIO BEEP ====================
function beep(freq = 880, duration = 0.15, type = 'sine') {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) { console.log('Audio beep failed', e); }
}

// ==================== DISPLAY POWER MANAGEMENT ====================
let displayTimer = null;
const DISPLAY_OFF_DELAY = 5000;
const DISPLAY_ON_DURATION = 3000;

function wakeDisplay() {
  document.body.classList.remove('display-off');
  clearTimeout(displayTimer);
  displayTimer = setTimeout(() => {
    if (!recording) document.body.classList.add('display-off');
  }, DISPLAY_ON_DURATION);
}

function scheduleDisplayOff() {
  clearTimeout(displayTimer);
  displayTimer = setTimeout(() => {
    if (!recording) document.body.classList.add('display-off');
  }, DISPLAY_OFF_DELAY);
}

['touchstart', 'mousedown', 'mousemove', 'keydown'].forEach(evt => {
  document.addEventListener(evt, () => {
    if (document.body.classList.contains('display-off')) wakeDisplay();
    else scheduleDisplayOff();
  }, { passive: true });
});

document.getElementById('wake-overlay').addEventListener('touchstart', (e) => {
  e.preventDefault(); wakeDisplay();
});
document.getElementById('wake-overlay').addEventListener('mousedown', (e) => {
  e.preventDefault(); wakeDisplay();
});

scheduleDisplayOff();

setInterval(() => {
  if (recording) document.body.classList.remove('display-off');
}, 1000);

// ==================== LOGGING ====================
function log(msg) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 20) el.removeChild(el.firstChild);
}

// ==================== BLE CONNECTION ====================
async function connect() {
  try {
    log('Requesting BLE device...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'IMU-Recorder' }],
      optionalServices: [SERVICE_UUID]
    });
    
    device.addEventListener('gattserverdisconnected', onDisconnect);
    
    log('Connecting GATT...');
    server = await device.gatt.connect();
    
    // Request high throughput (Android only, silently fails elsewhere)
    try {
      if (server.device && server.device.gatt && server.device.gatt.requestConnectionPriority) {
        await server.device.gatt.requestConnectionPriority('high');
        log('Connection priority: high');
      }
    } catch(e) { /* ignore */ }
    
    log('Getting service...');
    service = await server.getPrimaryService(SERVICE_UUID);
    
    timeChar    = await service.getCharacteristic(CHAR_TIME_UUID);
    controlChar = await service.getCharacteristic(CHAR_CONTROL_UUID);
    dataChar    = await service.getCharacteristic(CHAR_DATA_UUID);
    
    // Sync Unix time
    const nowSec = Math.floor(Date.now() / 1000);
    const timeBuf = new ArrayBuffer(4);
    new DataView(timeBuf).setUint32(0, nowSec, true);
    await timeChar.writeValue(timeBuf);
    baseEpochMs = nowSec * 1000;
    log(`Synced epoch: ${nowSec}`);
    
    await dataChar.startNotifications();
    dataChar.addEventListener('characteristicvaluechanged', onData);
    
    updateUI(true);
    log('Connected and ready');
    beep(660, 0.1);
    
  } catch (err) {
    log('Error: ' + err.message);
    console.error(err);
  }
}

function onDisconnect() {
  log('Disconnected');
  recording = false;
  updateUI(false);
  device = null; server = null; service = null;
}

async function refreshConnection() {
  if (device && device.gatt.connected) {
    const nowSec = Math.floor(Date.now() / 1000);
    const timeBuf = new ArrayBuffer(4);
    new DataView(timeBuf).setUint32(0, nowSec, true);
    await timeChar.writeValue(timeBuf);
    baseEpochMs = nowSec * 1000;
    log('Time refreshed');
    beep(880, 0.08);
  } else {
    log('Not connected');
  }
}

// ==================== CONTROL ====================
async function startRecording() {
  if (!controlChar) return;
  recording = true;
  samples = [];
  lastSeq = -1;
  droppedPackets = 0;
  totalPackets = 0;
  batchAccumulator = 0;
  batchCount = 0;
  updateMetrics();
  
  await controlChar.writeValue(new Uint8Array([0x01]));
  beep(1047, 0.2, 'sine');
  log('Recording started');
  updateUI(true);
}

async function stopRecording() {
  if (!controlChar) return;
  recording = false;
  await controlChar.writeValue(new Uint8Array([0x00]));
  beep(440, 0.25, 'sine');
  log(`Recording stopped. ${samples.length} samples captured.`);
  updateUI(true);
}

// ==================== DATA PARSING ====================
function onData(event) {
  const value = event.target.value;
  const dv = new DataView(value.buffer);
  
  const seq = dv.getUint8(0);
  const count = dv.getUint8(1);
  
  totalPackets++;
  batchAccumulator += count;
  batchCount++;
  
  // Detect packet loss
  if (lastSeq >= 0) {
    const expected = (lastSeq + 1) & 0xFF;
    if (seq !== expected) {
      const lost = (seq - expected + 256) & 0xFF;
      droppedPackets += lost;
    }
  }
  lastSeq = seq;
  
  let offset = 2;
  for (let i = 0; i < count; i++) {
    const relMs = dv.getUint32(offset, true);
    offset += 4;
    const ax = dv.getInt16(offset, true); offset += 2;
    const ay = dv.getInt16(offset, true); offset += 2;
    const az = dv.getInt16(offset, true); offset += 2;
    const gx = dv.getInt16(offset, true); offset += 2;
    const gy = dv.getInt16(offset, true); offset += 2;
    const gz = dv.getInt16(offset, true); offset += 2;
    
    const timestamp = baseEpochMs + relMs;
    
    samples.push({
      timestamp,
      ax: ax * ACCEL_SCALE,
      ay: ay * ACCEL_SCALE,
      az: az * ACCEL_SCALE,
      gx: gx * GYRO_SCALE,
      gy: gy * GYRO_SCALE,
      gz: gz * GYRO_SCALE
    });
  }
  
  updateMetrics();
}

function updateMetrics() {
  document.getElementById('sample-count').textContent = samples.length.toLocaleString();
  document.getElementById('packet-loss').textContent = droppedPackets.toLocaleString();
  
  const batchEl = document.getElementById('batch-size');
  if (batchCount > 0) {
    batchEl.textContent = (batchAccumulator / batchCount).toFixed(1);
  } else {
    batchEl.textContent = '0';
  }
  
  const pktMetric = document.getElementById('pkt-metric');
  if (droppedPackets > 10) pktMetric.classList.add('danger');
  else if (droppedPackets > 0) pktMetric.classList.add('warn');
  else { pktMetric.classList.remove('danger', 'warn'); }
}

// ==================== CSV DOWNLOAD ====================
function downloadCSV() {
  if (samples.length === 0) {
    log('No data to download');
    return;
  }
  
  const header = 'Timestamp_ms,Unix_Time,Accel_X_g,Accel_Y_g,Accel_Z_g,Gyro_X_dps,Gyro_Y_dps,Gyro_Z_dps\n';
  const rows = samples.map(s => {
    const unixSec = (s.timestamp / 1000).toFixed(3);
    return `${s.timestamp},${unixSec},${s.ax.toFixed(6)},${s.ay.toFixed(6)},${s.az.toFixed(6)},${s.gx.toFixed(4)},${s.gy.toFixed(4)},${s.gz.toFixed(4)}`;
  }).join('\n');
  
  const blob = new Blob([header + rows], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const dateStr = new Date().toISOString().replace(/[:.]/g, '-');
  a.download = `imu_recording_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  log(`Downloaded ${samples.length} samples`);
  beep(880, 0.1);
}

// ==================== UI UPDATES ====================
function updateUI(connected) {
  document.getElementById('btn-connect').disabled = connected;
  document.getElementById('btn-start').disabled = !connected || recording;
  document.getElementById('btn-stop').disabled = !connected || !recording;
  document.getElementById('btn-refresh').disabled = !connected;
  document.getElementById('btn-download').disabled = samples.length === 0;
  
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  const rec = document.getElementById('rec-indicator');
  
  if (connected) {
    dot.classList.add('connected');
    txt.textContent = 'Connected';
  } else {
    dot.classList.remove('connected');
    txt.textContent = 'Disconnected';
  }
  
  rec.style.display = recording ? 'inline' : 'none';
  if (recording) dot.classList.add('recording');
  else dot.classList.remove('recording');
}

if (!navigator.bluetooth) {
  log('Web Bluetooth not supported. Use Chrome/Edge on desktop or Android.');
  alert('Web Bluetooth is not supported in this browser. Please use Chrome or Edge.');
}
</script>

</body>
</html>
