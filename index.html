<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gait Analysis Streamer (Zero-Loss)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background: #f4f4f9; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-pair { background: #007bff; color: white; } .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; } .btn-reset { background: #ffc107; color: black; }
        .btn-dl { background: #6c757d; color: white; } .btn-copy { background: #17a2b8; color: white; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .sensor-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #ccc; }
        .sensor-card.active { border-left-color: #28a745; background: #f8fff8; }
        #log { background: #222; color: #0f0; padding: 10px; border-radius: 5px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Gait Metrics Streamer (Zero-Loss)</h1>
    <div class="controls">
        <button id="btnPair" class="btn-pair">1. Pair Sensor(s)</button>
        <button id="btnStart" class="btn-start" disabled>2. Start Recording</button>
        <button id="btnStop" class="btn-stop" disabled>3. Stop Recording</button>
        <button id="btnReset" class="btn-reset">4. Reset Data</button>
        <button id="btnDownload" class="btn-dl" disabled>5. Download CSV</button>
        <button id="btnCopy" class="btn-copy" disabled>6. Copy to Clipboard</button>
    </div>
    <div class="status-panel">
        <div id="card-1" class="sensor-card"><h3>Right Leg (ID 1)</h3><div id="status-1">Disconnected</div></div>
        <div id="card-2" class="sensor-card"><h3>Left Leg (ID 2)</h3><div id="status-2">Disconnected</div></div>
        <div id="card-3" class="sensor-card"><h3>Torso (ID 3)</h3><div id="status-3">Disconnected</div></div>
    </div>
    <div id="log"></div>

    <script>
        const SERVICE_UUID = '19b10000-e8f2-537e-4f6c-d104768a1214';
        const DATA_CHAR_UUID = '19b10001-e8f2-537e-4f6c-d104768a1214';
        const CTRL_CHAR_UUID = '19b10002-e8f2-537e-4f6c-d104768a1214';
        const LABELS = { 1: "Right Leg", 2: "Left Leg", 3: "Torso" };
        const BATCH_SIZE = 20; // Must match Arduino
        
        let devices = {}; 
        let isRecording = false;
        let rawPackets = []; // Stores raw bytes instantly, zero math here!

        const logDiv = document.getElementById('log');
        const btnPair = document.getElementById('btnPair');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnReset = document.getElementById('btnReset');
        const btnDownload = document.getElementById('btnDownload');
        const btnCopy = document.getElementById('btnCopy');

        function log(msg) { logDiv.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`; logDiv.scrollTop = logDiv.scrollHeight; }

        btnPair.addEventListener('click', async () => {
            try {
                log("Scanning... Please select a GaitSense device.");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'GaitSense_' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const charData = await service.getCharacteristic(DATA_CHAR_UUID);
                const charCtrl = await service.getCharacteristic(CTRL_CHAR_UUID);

                const id = parseInt(device.name.split('_')[1]);
                if (isNaN(id) || id < 1 || id > 3) return;

                devices[id] = { device, charData, charCtrl };
                document.getElementById(`status-${id}`).innerText = "Connected";
                document.getElementById(`card-${id}`).classList.add('active');

                await charData.startNotifications();
                charData.addEventListener('characteristicvaluechanged', (event) => handleDataPacket(id, event.target.value));

                device.addEventListener('gattserverdisconnected', () => {
                    log(`⚠️ ${device.name} disconnected.`);
                    document.getElementById(`status-${id}`).innerText = "Disconnected";
                    document.getElementById(`card-${id}`).classList.remove('active');
                    delete devices[id];
                    checkButtons();
                });

                log(`✅ Connected to ${device.name} (${LABELS[id]})`);
            } catch (error) {
                if (error.name !== 'NotFoundError') log(`❌ Pairing failed: ${error}`);
            }
            checkButtons();
        });

        // --- ZERO-LATENCY DATA HANDLING ---
        function handleDataPacket(id, value) {
            if (!isRecording) return;
            if (value.byteLength < 244) return; 
            
            // Instantly copy raw bytes and timestamp. NO MATH.
            rawPackets.push({
                id: id,
                jsTime: Date.now(),
                buffer: new Uint8Array(value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength))
            });
        }

        async function sendCommand(cmd) {
            const uint8Cmd = new Uint8Array([cmd]);
            for (let id in devices) {
                try { await devices[id].charCtrl.writeValue(uint8Cmd); } catch (e) {}
            }
        }

        btnStart.addEventListener('click', async () => {
            isRecording = true;
            rawPackets = [];
            log(`🔴 Recording Started with ${Object.keys(devices).length} sensor(s)...`);
            await sendCommand(1);
            checkButtons();
        });

        btnStop.addEventListener('click', async () => {
            isRecording = false;
            log("⏹️ Recording Stopped.");
            await sendCommand(0);
            checkButtons();
        });

        btnReset.addEventListener('click', () => {
            rawPackets = [];
            log("🗑️ Data reset.");
            checkButtons();
        });

        function checkButtons() {
            const count = Object.keys(devices).length;
            const hasData = rawPackets.length > 0;
            btnStart.disabled = (count === 0) || isRecording;
            btnStop.disabled = !isRecording;
            btnDownload.disabled = !hasData;
            btnCopy.disabled = !hasData;
            btnPair.disabled = isRecording;
        }

        // --- HEAVY MATH DEFERRED TO DOWNLOAD TIME ---
        function generateCSV() {
            if (rawPackets.length === 0) return "";
            
            const rows = ["Timestamp_Unix_MS,Sensor_ID,Acc_X_ms2,Acc_Y_ms2,Acc_Z_ms2,Gyro_X_dps,Gyro_Y_dps,Gyro_Z_dps"];
            
            // 1. Find the absolute earliest MCU time to establish a global baseline
            let baselineJs = 0;
            let baselineMcu = 0;
            
            for (let p of rawPackets) {
                const view = new DataView(p.buffer.buffer, p.buffer.byteOffset, p.buffer.byteLength);
                const batchEndMcu = view.getUint32(0, true);
                const firstSampleMcu = batchEndMcu - ((BATCH_SIZE - 1) * 5000);
                
                if (baselineJs === 0 || firstSampleMcu < baselineMcu) {
                    baselineMcu = firstSampleMcu;
                    baselineJs = p.jsTime;
                }
            }
            
            // 2. Parse all packets and calculate physical units
            let parsedData = [];
            
            for (let p of rawPackets) {
                const view = new DataView(p.buffer.buffer, p.buffer.byteOffset, p.buffer.byteLength);
                const batchEndMcu = view.getUint32(0, true);
                
                for (let i = 0; i < BATCH_SIZE; i++) {
                    const sampleMcu = batchEndMcu - ((BATCH_SIZE - 1 - i) * 5000);
                    const exactUnixTime = baselineJs + ((sampleMcu - baselineMcu) / 1000);
                    
                    const offset = 4 + (i * 12);
                    
                    const ax = view.getInt16(offset, true) * (4.0 / 32768.0) * 9.81;
                    const ay = view.getInt16(offset + 2, true) * (4.0 / 32768.0) * 9.81;
                    const az = view.getInt16(offset + 4, true) * (4.0 / 32768.0) * 9.81;
                    
                    const gx = view.getInt16(offset + 6, true) * (500.0 / 32768.0);
                    const gy = view.getInt16(offset + 8, true) * (500.0 / 32768.0);
                    const gz = view.getInt16(offset + 10, true) * (500.0 / 32768.0);
                    
                    parsedData.push({ t: exactUnixTime, id: p.id, ax, ay, az, gx, gy, gz });
                }
            }
            
            // 3. Sort chronologically and format
            parsedData.sort((a, b) => a.t - b.t);
            
            for (let r of parsedData) {
                rows.push(`${r.t.toFixed(3)},${r.id},${r.ax.toFixed(4)},${r.ay.toFixed(4)},${r.az.toFixed(4)},${r.gx.toFixed(4)},${r.gy.toFixed(4)},${r.gz.toFixed(4)}`);
            }
            
            return rows.join('\n');
        }

        btnDownload.addEventListener('click', () => {
            log("🔄 Processing raw data into CSV...");
            const csvContent = generateCSV();
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
            
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const filename = `gait_data_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.csv`;
            
            if (typeof saveAs !== 'undefined') {
                saveAs(blob, filename);
            } else {
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url; link.download = filename;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
            log(`💾 Downloaded: ${filename} (${rawPackets.length * BATCH_SIZE} samples).`);
        });

        btnCopy.addEventListener('click', async () => {
            log("🔄 Processing raw data for clipboard...");
            const csvContent = generateCSV();
            try {
                await navigator.clipboard.writeText(csvContent);
                log(`📋 Copied ${rawPackets.length * BATCH_SIZE} rows to clipboard!`);
            } catch (err) {
                log("❌ Failed to copy. Check browser permissions.");
            }
        });
    </script>
</body>
</html>
